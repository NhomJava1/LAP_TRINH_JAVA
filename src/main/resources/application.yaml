server:
  port: 8080

spring:
  application:
    name: octapoint-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:octapoint_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true        # Bật H2 Console
      path: /h2-console    # Đường dẫn truy cập
      settings:
        web-allow-others: true