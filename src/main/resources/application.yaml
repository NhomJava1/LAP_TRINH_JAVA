server:
  port: 8080

spring:
  application:
    name: octapoint-core
  datasource:
    url: jdbc:h2:mem:octapoint_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info