spring:
  datasource:
    url: jdbc:h2:mem:octapoint_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 25
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  security:
    api-key-master-key: test-master-key-32-bytes-length!
    admin-token: test-admin-token
    jwt-secret: test-jwt-secret-key-at-least-32-bytes-long!
    default-admin-email: admin@octapoint.io
    default-admin-password: admin123
    nonce-store: memory
  settlement:
    mode: MOCK
    worker-enabled: false
    poll-interval-ms: 60000
    max-retries: 3
  signer:
    base-url: http://localhost:3001
    service-token: test-signer-token
