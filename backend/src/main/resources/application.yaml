server:
  port: 8080

spring:
  application:
    name: octapoint-core

  # Cấu hình kết nối PostgreSQL (Docker)
  datasource:
    url: jdbc:postgresql://postgres:5432/octapoint_db
    username: postgres
    password: secretpassword
    driver-class-name: org.postgresql.Driver

  # Cấu hình Redis
  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # TẮT FLYWAY ĐỂ TRÁNH LỖI KHỞI ĐỘNG
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: '*'

app:
  security:
    api-key-master-key: ${API_KEY_MASTER_KEY:12345678901234567890123456789012}
    admin-token: ${API_KEY_ADMIN_TOKEN:octapoint_dev_admin_token}