server:
  port: 8080

spring:
  application:
    name: octapoint-core
  
  datasource:
    url: jdbc:h2:mem:octapoint_db
    username: sa
    password: ''

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: '*'

app:
  security:
    api-key-master-key: ${API_KEY_MASTER_KEY:12345678901234567890123456789012}
    admin-token: ${API_KEY_ADMIN_TOKEN:octapoint_dev_admin_token}
    encryption-secret: ${ENCRYPTION_SECRET:my-secure-32-chars-encryption-key!!}