server:
  port: 8080

spring:
  application:
    name: octapoint-core

  datasource:
    url: jdbc:postgresql://localhost:5432/octapoint_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.octapoint.core

management:
  endpoints:
    web:
      exposure:
        include: '*'

app:
  security:
    api-key-master-key: ${API_KEY_MASTER_KEY:12345678901234567890123456789012}
    admin-token: ${API_KEY_ADMIN_TOKEN:octapoint_dev_admin_token}