server:
  port: 8080

spring:
  application:
    name: octapoint-core
  
  datasource:
    url: jdbc:h2:mem:octapoint_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: '*'

app:
  security:
    api-key-master-key: "12345678901234567890123456789012"