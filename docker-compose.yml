services:
  postgres:
    image: postgres:15-alpine
    container_name: octapoint_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-octapoint_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: octapoint_redis
    ports:
      - "6379:6379"

  sui-cli:
    build:
      context: .
      dockerfile: docker/sui/Dockerfile
    volumes:
      - sui-config:/root/.sui
      - ./contracts:/workspace/contracts
    working_dir: /workspace
    # Dockerfile dùng ENTRYPOINT=sui; override để mở shell Linux.
    entrypoint: []
    command: ["bash"]
    stdin_open: true
    tty: true

  signer:
    build:
      context: .
      dockerfile: signer/Dockerfile
    container_name: octapoint_signer
    env_file:
      - path: ./signer/.env
        required: false
    environment:
      PORT: "3001"
    ports:
      - "3001:3001"

  core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-octapoint_db}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_KEY_MASTER_KEY: ${API_KEY_MASTER_KEY:?Set API_KEY_MASTER_KEY in .env}
      API_KEY_ADMIN_TOKEN: ${API_KEY_ADMIN_TOKEN:?Set API_KEY_ADMIN_TOKEN in .env}
      JWT_SECRET: ${JWT_SECRET:-octapoint-local-dev-jwt-secret-key-2026!!}
      SETTLEMENT_MODE: ${SETTLEMENT_MODE:-LIVE}
      SIGNER_BASE_URL: ${SIGNER_BASE_URL:-http://signer:3001}
      SIGNER_SERVICE_TOKEN: ${SIGNER_SERVICE_TOKEN:-replace-with-random-internal-token}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - signer

volumes:
  pgdata:
  sui-config: