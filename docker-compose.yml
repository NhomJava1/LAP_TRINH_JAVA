services:
  postgres:
    image: postgres:15-alpine
    container_name: octapoint_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-octapoint_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: octapoint_redis
    ports:
      - "6379:6379"

  sui-cli:
    build:
      context: .
      dockerfile: docker/sui/Dockerfile
    volumes:
      - sui-config:/root/.sui
      - ./contracts:/workspace/contracts
    working_dir: /workspace
    # Dockerfile dùng ENTRYPOINT=sui; override để mở shell Linux.
    entrypoint: []
    command: ["bash"]
    stdin_open: true
    tty: true

  signer:
    build:
      context: ./signer
      dockerfile: Dockerfile
    container_name: octapoint_signer
    environment:
      PORT: ${SIGNER_PORT:-3001}
      SUI_RPC_URL: ${SUI_RPC_URL:-https://fullnode.testnet.sui.io:443}
      SUI_PRIVATE_KEY: ${SUI_PRIVATE_KEY:?Set SUI_PRIVATE_KEY in .env}
      SUI_PACKAGE_ID: ${SUI_PACKAGE_ID:?Set SUI_PACKAGE_ID in .env}
      SUI_MODULE_NAME: ${SUI_MODULE_NAME:-octapoint}
      SUI_ADMIN_CAP_ID: ${SUI_ADMIN_CAP_ID:?Set SUI_ADMIN_CAP_ID in .env}
      SUI_BALANCE_ID: ${SUI_BALANCE_ID:?Set SUI_BALANCE_ID in .env}
      SERVICE_TOKEN: ${SIGNER_SERVICE_TOKEN:?Set SIGNER_SERVICE_TOKEN in .env}
    ports:
      - "${SIGNER_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health',{headers:{'X-Service-Token':process.env.SERVICE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-octapoint_db}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_KEY_MASTER_KEY: ${API_KEY_MASTER_KEY:?Set API_KEY_MASTER_KEY in .env}
      API_KEY_ADMIN_TOKEN: ${API_KEY_ADMIN_TOKEN:?Set API_KEY_ADMIN_TOKEN in .env}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      # ... giữ nguyên các biến cũ ...
      SIGNER_URL: ${SIGNER_URL:-http://signer:3001}
      SIGNER_SERVICE_TOKEN: ${SIGNER_SERVICE_TOKEN:?Set SIGNER_SERVICE_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      signer:
        condition: service_healthy

volumes:
  pgdata:
  sui-config: